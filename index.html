<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Meu App IPTV</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#090909;
 color:white;
}
header{
 padding:28px 20px;
 text-align:center;
 background:linear-gradient(135deg,#111,#202020);
 border-bottom:1px solid #292929;
}
.logo{font-size:48px}
h1{margin:5px 0;font-size:30px}
.sub{color:#aaa;font-size:15px}

.container{padding:24px 16px}
.titulo{
 font-size:24px;
 font-weight:bold;
 margin-bottom:18px;
}
.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:14px;
}
.card{
 background:linear-gradient(145deg,#202020,#151515);
 border:1px solid #292929;
 border-radius:18px;
 padding:24px 10px;
 text-align:center;
 min-height:145px;
 transition:.2s;
}
.card:active{transform:scale(.97)}
.icon{font-size:45px;margin-bottom:12px}
.nome{font-size:17px;font-weight:bold}
.info{
 margin-top:28px;
 padding:18px;
 border-radius:16px;
 background:#151515;
 border:1px solid #282828;
}
.info h2{margin-top:0;font-size:19px}
.info p{color:#aaa;line-height:1.5}

.status{
 display:inline-block;
 margin-top:8px;
 padding:5px 10px;
 border-radius:20px;
 background:#183b22;
 color:#72e28a;
 font-size:12px;
}
footer{
 text-align:center;
 padding:30px 10px;
 color:#777;
 font-size:12px;
}
@media(max-width:380px){
 .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
 <div class="logo">📺</div>
 <h1>Meu App IPTV</h1>
 <div class="sub">Sua programação em um só lugar</div>
</header>

<div class="container">

 <div class="titulo">Categorias</div>

 <div class="grid">

  <div class="card">
   <div class="icon">🔴</div>
   <div class="nome">Ao Vivo</div>
   <div class="status">ONLINE</div>
  </div>

  <div class="card">
   <div class="icon">🎬</div>
   <div class="nome">Filmes</div>
  </div>

  <div class="card">
   <div class="icon">📺</div>
   <div class="nome">Séries</div>
  </div>

  <div class="card">
   <div class="icon">⚽</div>
   <div class="nome">Esportes</div>
  </div>

 </div>

 <div class="info">
  <h2>📡 Canais ao vivo</h2>
  <p>
   Aqui ficará a programação ao vivo. 
   Podemos adicionar canais e fontes de transmissão
   autorizadas posteriormente.
  </p>
 </div>

</div>

<footer>
  Meu App IPTV • Versão 1.0
</footer>

<script>
document.querySelectorAll(".card").forEach(card => {
  card.addEventListener("click", () => {
    const categoria = card.querySelector(".nome").textContent.trim();
    const info = document.querySelector(".info");

   if (categoria === "Ao Vivo") {
  info.innerHTML = `
    <h2>📺 Canais ao Vivo</h2>
    <p>Escolha um canal autorizado para testar.</p>

    <div class="canal">
      <h3>🟢 Canal de Teste</h3>
      <p>Transmissão de demonstração.</p>
      <button onclick="alert('Player de teste funcionando!')">
        ▶️ Assistir
      </button>
    </div>
  `;
} else {
  info.innerHTML = `
    <h2>📺 ${categoria}</h2>
    <p>Esta seção será adicionada ao aplicativo.</p>
  `;
window.scrollTo({
  top: info.offsetTop - 20,
  behavior: "smooth"
});  
});

 
</script>
                                      

</body>
</html>
